esphome:
  name: pr127-runtime
  friendly_name: PR127 Runtime
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: ioe1_light
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%
      - light.turn_on:
          id: io2_light
          red: 0%
          green: 100%
          blue: 0%
          brightness: 100%

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: <repo>/components
    components: [m5ioe1, extio2]

logger:
  level: VERY_VERBOSE

i2c:
  sda: 21
  scl: 22
  scan: false

m5ioe1:
  id: ioe1

extio2:
  id: io2

light:
  - platform: m5ioe1
    id: ioe1_light
    name: "M5IOE1 Strip"
    m5ioe1_id: ioe1
    num_led: 4
  - platform: extio2
    id: io2_light
    name: "EXTIO2 Strip"
    type: addressable_light
    extio2_id: io2
    num_leds: 4
