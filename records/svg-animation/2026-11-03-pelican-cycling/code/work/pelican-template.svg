    <use xlink:href="#wheel" transform="translate(340 562)"/>
    <use xlink:href="#wheel" transform="translate(760 562)"/>
    <path d="M241 530A103 103 0 0 1 432 515 M679 493A104 104 0 0 1 856 522" fill="none" stroke="#dba77b" stroke-width="5"/>
    <path d="M341 562L480 429L540 537Z M480 429L695 422L540 537 M695 422L760 562" fill="none" stroke="#994b3e" stroke-width="12"/>
    <path d="M341 560L480 429L540 537 M480 429L695 422L540 537 M699 432L756 556" fill="none" stroke="#df775f" stroke-width="8"/>
    <path d="M480 429L468 405 M694 421L687 398Q718 382 704 377L674 377" fill="none" stroke="#294947" stroke-width="7"/>
    <path d="M672 377h24" stroke="#b58455" stroke-width="10"/>
    <path d="M438 402Q468 394 493 401Q502 404 500 410Q470 421 438 413Q429 410 438 402Z" fill="#294947"/>
    <path d="M442 402q22-4 45 0" fill="none" stroke="#618077" stroke-width="2.5"/>
    <path d="M692 391Q668 415 681 438" fill="none" stroke="#294947" stroke-width="2"/>
    <circle cx="540" cy="537" r="26" fill="#e7d4ad" stroke="#294947" stroke-width="3.5"/>
    <path d="M340 550L537 512A25 25 0 0 1 541 562L340 573A12 12 0 0 1 340 550Z" fill="none" stroke="#294947" stroke-width="3"/>
