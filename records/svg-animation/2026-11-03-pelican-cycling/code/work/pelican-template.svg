    <g fill="#79846c" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">
      <text x="74" y="775">SEA BREEZE · TWO WHEELS · NO HURRY</text>
      <text x="1046" y="775" text-anchor="end">∞</text>
    </g>
  </g>
</svg>
