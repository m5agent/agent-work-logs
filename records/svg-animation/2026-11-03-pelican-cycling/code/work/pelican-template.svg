        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.46;.47;.49;.5;1" dur="5.4s" repeatCount="indefinite"/>
      </path>
      <path d="M660 209q6-4 12 0" fill="none" stroke="#294947" stroke-width="2.2" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.46;.47;.49;.5;1" dur="5.4s" repeatCount="indefinite"/>
      </path>

      <!-- A small scarf catches the sea breeze. -->
      <path d="M605 282C578 270 555 287 527 266L535 290L519 293C554 309 582 285 607 299Z" fill="#3e8277" stroke="#294947" stroke-width="3">
        <animate attributeName="d" values="M605 282C578 270 555 287 527 266L535 290L519 293C554 309 582 285 607 299Z;M605 282C579 287 553 265 524 275L537 290L520 302C555 293 581 306 607 299Z;M605 282C578 270 555 287 527 266L535 290L519 293C554 309 582 285 607 299Z" dur=".8s" repeatCount="indefinite"/>
      </path>
      <path d="M604 278Q627 292 658 285L659 302Q628 309 605 296Z" fill="#448c7b" stroke="#294947" stroke-width="3"/>
      <path d="M611 285q22 12 40 7" fill="none" stroke="#86b3a0" stroke-width="2"/>
      <path d="M604 285q14-3 17 8q-9 15-18 7q-6-7 1-15Z" fill="#3e8277" stroke="#294947" stroke-width="2.5"/>

      <!-- The near wing stretches naturally to the handlebar. -->
      <path d="M405 318C441 285 495 284 534 309C552 321 567 339 594 348L646 364L686 370Q701 371 700 383Q699 391 689 389L647 383L587 370Q557 366 537 349C504 371 461 373 426 350Q410 340 405 318Z" fill="#f5f3e7" stroke="#294947" stroke-width="4"/>
      <path d="M417 322C451 309 478 310 506 322Q539 341 566 357C538 351 525 336 506 337Q469 345 445 334" fill="#e0e5d6"/>
      <g fill="none" stroke="#a9b6a4" stroke-width="2.4">
        <path d="M430 319q30-8 53 5M437 332q29-6 53 5M450 345q25-3 46 1M515 329q12 8 21 18"/>
