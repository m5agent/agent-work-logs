<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
  <title id="title">顺风兜一圈 · 鹈鹕骑行</title>
  <desc id="desc">一只系着绿色围巾的白色鹈鹕，踩着珊瑚红自行车沿海岸骑行。脚掌跟随踏板，车轮连续旋转，围巾和芦苇随风摇摆。</desc>
  <defs>
    <pattern id="paper" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r=".5" fill="#7d7462" opacity=".07"/>
      <circle cx="5" cy="5" r=".4" fill="#7d7462" opacity=".05"/>
    </pattern>
    <clipPath id="scene"><rect width="1120" height="800" rx="28"/></clipPath>
    <g id="spokes" stroke="#526b69" stroke-width="1.6" opacity=".51">
      <path d="M-104 0H104 M0-104V104 M-73.54-73.54L73.54 73.54 M-73.54 73.54L73.54-73.54 M-96.08-39.8L96.08 39.8 M-96.08 39.8L96.08-39.8 M-39.8-96.08L39.8 96.08 M-39.8 96.08L39.8-96.08"/>
    </g>
    <g id="wheel">
      <circle r="113" fill="#f7f3e8" stroke="#253e40" stroke-width="13"/>
      <circle r="104.7" fill="none" stroke="#e4d4b5" stroke-width="3.5"/>
      <g>
        <use xlink:href="#spokes"/>
        <path d="M79-67l5-5" stroke="#e8a75f" stroke-width="5" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#263f40"/><circle r="3.5" fill="#b0bcb0"/>
    </g>
  </defs>
  <g clip-path="url(#scene)" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#f8f3e8" d="M0 0h1120v800H0z"/>
    <path fill="url(#paper)" d="M0 0h1120v800H0z"/>

    <!-- A little coastal world, drawn from scratch. -->
    <g fill="#d98257" font-family="Arial, Helvetica, sans-serif">
      <text x="74" y="82" font-size="12" font-weight="700" letter-spacing="3.6">THE PELICAN CYCLE CLUB</text>
      <path d="M74 101h36" stroke="#d98257" stroke-width="2"/>
      <text x="74" y="142" fill="#294a49" font-size="32" font-family="Georgia, serif" font-style="italic">A little seaside ride.</text>
    </g>
    <circle cx="847" cy="211" r="92" fill="#f1cd75" opacity=".79"/>
    <circle cx="847" cy="211" r="112" fill="none" stroke="#e7bc69" stroke-width="1" stroke-dasharray="2 10" opacity=".3"/>
    <g fill="#fffdf5" opacity=".8">
      <path d="M153 250c0-15 12-28 28-28 10-24 44-24 56-4 18-7 37 5 38 22 15-1 25 4 29 10z">
        <animateTransform attributeName="transform" type="translate" values="0 0;-22 0;0 0" dur="18s" repeatCount="indefinite"/>
      </path>
      <path d="M855 344c3-15 19-22 33-16 13-22 43-19 51 5 18-6 34 5 36 17H855z">
        <animateTransform attributeName="transform" type="translate" values="0 0;-15 0;0 0" dur="22s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="none" stroke="#849a8a" stroke-width="2.4" opacity=".7">
      <path d="M918 121q12-10 23 0q11-10 22 0"/>
      <path d="M979 164q8-7 16 0q8-7 16 0"/>
    </g>
    <path d="M0 477Q155 431 303 474T605 469T906 472T1200 453V578H0Z" fill="#d5e1d6" opacity=".7"/>
    <path d="M0 513Q163 469 330 505T661 501T998 491T1168 497V589H0Z" fill="#acc7bf" opacity=".58"/>
    <g fill="none" stroke="#f8f3e8" stroke-width="3" opacity=".65">
      <path d="M44 515h58m23 0h18m711-3h41m20 0h73M167 542h77m642-2h82"/>
    </g>
    <path d="M0 571Q164 548 297 577T590 572T897 571T1120 562V800H0Z" fill="#ede1c4"/>
    <path d="M0 620Q294 604 560 622T1120 617V800H0Z" fill="#f2e9d6"/>
    <path d="M73 681H1055" fill="none" stroke="#d6c5a5" stroke-width="2"/>
    <g stroke="#c5b698" stroke-width="2.5" opacity=".65">
      <g>
        <path d="__ROAD_A__"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-344 0" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <g>
        <path d="__ROAD_B__"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-510 0" dur="1.2s" repeatCount="indefinite"/>
