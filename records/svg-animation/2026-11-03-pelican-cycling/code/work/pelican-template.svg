      <animateTransform attributeName="transform" type="translate" values="0 0;-5 0;0 0" dur="3s" repeatCount="indefinite"/>
      <g fill="none" stroke="#738c6b" stroke-width="3">
        <path d="M109 669q2-38-16-67M109 669q17-36 13-71M109 669q-20-20-27-17M109 669q30-17 38-14"/>
        <path d="M991 674q-2-37 18-67M991 674q-18-22-26-21M991 674q29-22 36-19"/>
      </g>
      <g fill="#b5ba8a">
        <ellipse cx="91" cy="599" rx="5" ry="12" transform="rotate(-30 91 599)"/>
        <ellipse cx="122" cy="596" rx="5" ry="12" transform="rotate(5 122 596)"/>
        <ellipse cx="1010" cy="607" rx="5" ry="11" transform="rotate(30 1010 607)"/>
      </g>
    </g>
    <g fill="none" stroke="#829589" stroke-width="2.5" opacity=".65">
      <path d="M244 365h-31m18 18h-42m45 18h-20">
        <animate attributeName="opacity" values=".3;.7;.3" dur="1.6s" repeatCount="indefinite"/>
      </path>
