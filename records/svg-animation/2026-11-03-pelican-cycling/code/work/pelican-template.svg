      <animate attributeName="stroke-dashoffset" from="0" to="-18" dur=".3s" repeatCount="indefinite"/>
    </path>
    <circle cx="540" cy="537" r="18" fill="#f7edd7" stroke="#a4ad96" stroke-width="1.5"/>
    <circle cx="540" cy="537" r="5" fill="#294947"/>
    <path d="M713 452l8 16" stroke="#f7d7a6" stroke-width="4"/>

    <!-- Near leg: its hip moves with the rider; ankle stays on the pedal. -->
    __NEAR_LEG__

    <!-- The pelican. -->
    <g id="rider">
      __BODY_BOB__
      <!-- Tail, neck and body are a single clear silhouette. -->
      <path d="M388 317Q358 312 331 291L343 329L311 317Q327 351 379 368C397 399 464 412 521 396C548 407 581 400 602 382C643 366 662 340 659 302L658 249C679 247 696 229 694 209C692 184 669 171 645 176C620 181 605 201 606 224L607 273C591 276 575 285 561 299C516 266 440 265 388 317Z" fill="#fffdf4" stroke="#294947" stroke-width="4.5"/>
      <path d="M599 294Q622 280 622 250L622 218Q625 191 649 184C626 181 609 200 610 224L611 275Z" fill="#e0e6d6"/>
      <path d="M385 358Q445 392 513 382Q563 389 601 368Q627 356 639 337C629 374 590 396 554 393C490 416 409 394 385 358Z" fill="#e3e8d9"/>
      <path d="M343 329l25 13m-24-10l22 19" stroke="#a8b7a6" stroke-width="2" fill="none"/>
      <path d="M624 180l-2-16q13 2 17 13M637 176l4-15q11 7 11 15" fill="#fffdf4" stroke="#294947" stroke-width="3"/>

      <!-- Soft throat pouch and the long, hooked bill. -->
      <path d="M682 231L877 237Q860 266 833 281C795 305 727 286 695 255Z" fill="#e7a378" stroke="#294947" stroke-width="3.5"/>
      <path d="M701 245Q769 293 835 272Q803 298 752 280Q716 269 701 245Z" fill="#d78b68"/>
      <path d="M693 245Q762 264 842 256" fill="none" stroke="#f6c398" stroke-width="3"/>
      <path d="M682 213L875 232Q897 235 887 249L878 255L876 244L685 240Z" fill="#eab658" stroke="#294947" stroke-width="3.5"/>
      <path d="M695 220L862 235" fill="none" stroke="#f7d691" stroke-width="3"/>
      <path d="M687 239L874 242" fill="none" stroke="#ae7844" stroke-width="2"/>
      <path d="M682 214l7 25-12 3" fill="#f4dba9"/>
      <ellipse cx="665" cy="210" rx="12" ry="14" fill="#f1dca9"/>
      <circle cx="666" cy="208" r="5.5" fill="#294947"/>
      <circle cx="667.5" cy="206.4" r="1.6" fill="#fffdf4"/>
      <path d="M657 192q7-4 14 0" stroke="#294947" stroke-width="2.4" fill="none"/>
      <ellipse cx="662" cy="229" rx="8" ry="4" fill="#efc2a3" opacity=".7"/>
